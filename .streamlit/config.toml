[global]
developmentMode = false

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 2048
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#16766f"
backgroundColor = "#f7faf9"
secondaryBackgroundColor = "#e9f1ef"
textColor = "#173c3a"
font = "sans serif"

